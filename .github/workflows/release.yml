name: Create Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.0.1, leave blank to use mod.json version)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Native DLL & Package Release Zip
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $VERSION = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref }}" -like "refs/tags/*") {
            $VERSION = "${{ github.ref }}".Replace("refs/tags/", "")
          } else {
            $manifest = Get-Content sf-cheatmenu/mod.json -Raw | ConvertFrom-Json
            $VERSION = "v$($manifest.version)"
          }
          echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
          Write-Host "Building package for version: $VERSION"

      - name: Compile Native Sidecar & Proxy DLLs
        shell: pwsh
        run: |
          Write-Host "Compiling sf-native.dll..."
          cd sf-cheatmenu/native
          clang++ -shared -O2 -std=c++17 -Iinclude src/main.cpp src/pattern_scan.cpp src/patcher.cpp -luser32 -o sf-native.dll
          if (-not (Test-Path sf-native.dll)) {
            Write-Error "Native DLL compilation failed!"
            exit 1
          }
          Write-Host "Successfully compiled sf-native.dll ($(Get-Item sf-native.dll).Length bytes)"
          
          Write-Host "Compiling proxy powrprof.dll..."
          clang++ -shared -O2 -D_CRT_SECURE_NO_WARNINGS proxy/powrprof.cpp "-Wl,-def:proxy/powrprof.def" -o proxy/powrprof.dll
          if (-not (Test-Path proxy/powrprof.dll)) {
            Write-Error "Proxy powrprof.dll compilation failed!"
            exit 1
          }
          Write-Host "Successfully compiled proxy/powrprof.dll ($(Get-Item proxy/powrprof.dll).Length bytes)"
          cd ../..

      - name: Assemble Mod Packages
        shell: pwsh
        run: |
          # 1. Assemble sf-cheatmenu (Runtime)
          New-Item -ItemType Directory -Force -Path build/sf-cheatmenu/src | Out-Null
          Copy-Item sf-cheatmenu/mod.json build/sf-cheatmenu/
          Copy-Item sf-cheatmenu/extended.mod.json build/sf-cheatmenu/
          Copy-Item sf-cheatmenu/icon.svg build/sf-cheatmenu/
          Copy-Item LICENSE build/sf-cheatmenu/
          Copy-Item README.md build/sf-cheatmenu/
          Copy-Item sf-cheatmenu/src/* build/sf-cheatmenu/src/ -Recurse
          Copy-Item sf-cheatmenu/native/native-plugin.ini build/sf-cheatmenu/
          Copy-Item sf-cheatmenu/native/sf-native.dll build/sf-cheatmenu/
          Copy-Item sf-cheatmenu/native/proxy/powrprof.dll build/sf-cheatmenu/

          # 2. Assemble sf-cheatmenu-assets (Static Patch)
          New-Item -ItemType Directory -Force -Path build/sf-cheatmenu-assets/src | Out-Null
          Copy-Item sf-cheatmenu-assets/mod.json build/sf-cheatmenu-assets/
          Copy-Item sf-cheatmenu-assets/extended.mod.json build/sf-cheatmenu-assets/
          Copy-Item sf-cheatmenu-assets/icon.svg build/sf-cheatmenu-assets/
          Copy-Item LICENSE build/sf-cheatmenu-assets/
          Copy-Item README.md build/sf-cheatmenu-assets/
          Copy-Item sf-cheatmenu-assets/src/* build/sf-cheatmenu-assets/src/ -Recurse

          # 3. Assemble Complete All-in-One Bundle (Drag-and-Drop for Game Root)
          New-Item -ItemType Directory -Force -Path build/bundle/mods/sf-cheatmenu | Out-Null
          New-Item -ItemType Directory -Force -Path build/bundle/mods/sf-cheatmenu-assets | Out-Null
          Copy-Item sf-cheatmenu/native/proxy/powrprof.dll build/bundle/
          Copy-Item build/sf-cheatmenu/* build/bundle/mods/sf-cheatmenu/ -Recurse
          Remove-Item build/bundle/mods/sf-cheatmenu/powrprof.dll -Force -ErrorAction SilentlyContinue
          Copy-Item build/sf-cheatmenu-assets/* build/bundle/mods/sf-cheatmenu-assets/ -Recurse

          Write-Host "Assembled packages successfully!"


      - name: Create Zip Archives & Checksums
        shell: pwsh
        run: |
          $VERSION = "${{ steps.get_version.outputs.VERSION }}"
          
          # Compress individual and bundle archives
          $archives = @(
            @{ Name = "sf-cheatmenu-$VERSION.zip"; Path = "build/sf-cheatmenu" },
            @{ Name = "sf-cheatmenu-assets-$VERSION.zip"; Path = "build/sf-cheatmenu-assets" },
            @{ Name = "sf-cheatmenu-bundle-$VERSION.zip"; Path = "build/bundle" }
          )

          foreach ($arch in $archives) {
            $zipName = $arch.Name
            $srcPath = $arch.Path
            Write-Host "Creating $zipName from $srcPath..."
            Compress-Archive -Path "$srcPath/*" -DestinationPath $zipName -Force
            $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
            "$hash  $zipName" | Out-File -FilePath "$zipName.sha256" -Encoding ascii
            Write-Host "  SHA256: $hash"
          }

      - name: Upload Build Artifacts (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: sf-cheatmenu-packages
          path: |
            *.zip
            *.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: SF Cheat Menu & Server Tweaks ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            *.zip
            *.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
