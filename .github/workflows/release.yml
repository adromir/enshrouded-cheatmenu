name: Create Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.0.0, leave blank to use mod.json version)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Release Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v$(jq -r .version mod.json)"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building package for version: ${VERSION}"

      - name: Assemble Mod Package
        run: |
          mkdir -p build/sf-cheatmenu/src
          
          # Copy essential mod files
          cp mod.json build/sf-cheatmenu/
          cp extended.mod.json build/sf-cheatmenu/
          cp icon.svg build/sf-cheatmenu/
          cp LICENSE build/sf-cheatmenu/
          cp README.md build/sf-cheatmenu/
          cp -r src/* build/sf-cheatmenu/src/

          # Validate assembled structure
          echo "Package contents:"
          ls -laR build/sf-cheatmenu/

      - name: Create Zip Archive
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ZIP_NAME="sf-cheatmenu-${VERSION}.zip"
          
          # Create zip containing the sf-cheatmenu folder
          cd build
          zip -r "../${ZIP_NAME}" sf-cheatmenu
          cd ..
          
          # Generate SHA256 checksum
          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
          
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "Checksum:"
          cat "${ZIP_NAME}.sha256"

      - name: Upload Build Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: SF Cheat Menu & Server Tweaks ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
