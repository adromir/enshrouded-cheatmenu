[Plugin]
Enabled=1
Dll=sf-native.dll

[Features]
; Set to 1 to bypass arrow decrement upon shooting (100% infinite arrows)
InfiniteArrows=1
; Set to 1 to bypass mid-air jump gate (infinite air jumping / jump height)
InfiniteAirJump=1
; Set to 1 to freeze/reset Shroud fog timer (100% immune in Shroud/Miasma)
InfiniteShroud=1
; Set to 1 to prevent all durability loss on weapons, pickaxes, axes and shields
InfiniteDurability=1
; Set to 1 to completely disable fall damage natively
NoFallDamage=1
; Set to 1 for zero-cost crafting and building (no resources consumed)
FreeCrafting=1
; Set to 1 to bypass consumable decrement on use (potions, food, bandages)
InfiniteConsumables=0


